<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Print Settings | Smart Print</title>

<style>

            font-family: 'Geist', sans-serif;

            background: transparent;

        }

        input[type='range']::-webkit-slider-runnable-track {
            background: #d3e4fe;
            height: 6px;
            border-radius: 3px;
        }

        input[type='range']::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: #093483;
            height: 16px;
            width: 16px;
            border-radius: 50%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e5eeff",

                        "tertiary-container": "#005c3e",
                        "surface-container-low": "#eff4ff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface": "#f8f9ff",
                        "on-surface-variant": "#444651",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-tertiary-fixed": "#002113",
                        "error-container": "#ffdad6",

                        "primary-container": "#2b4c9b",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#e1e0ff",
                        "tertiary": "#00422b",
                        "secondary-container": "#6063ee",
                        "primary-fixed": "#dae1ff",
                        "primary": "#093483",
                        "on-surface": "#0b1c30",
                        "outline": "#747682",
                        "on-primary-container": "#aec1ff",
                        "secondary": "#4648d4",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#07006c",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#213145",
                        "on-primary-fixed": "#001849",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-tertiary-container": "#49da9f",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-primary-fixed-variant": "#1f4291",
                        "surface-bright": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "inverse-primary": "#b3c5ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "surface-dim": "#cbdbf5",
                        "outline-variant": "#c4c6d3",
                        "surface-tint": "#3b5baa",
                        "on-background": "#0b1c30",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-fixed-dim": "#c0c1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-max": "1440px",
                        "margin-desktop": "40px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist"],
                        "headline-lg-mobile": ["Geist"],
                        "title-md": ["Geist"],
                        "label-md": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-xl": ["Geist"],
                        "body-lg": ["Geist"],
                        "label-sm": ["Geist"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-16 bg-surface dark:bg-surface flex justify-between items-center px-margin-mobile z-50 shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
<img alt="College Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-rLmp1Ez-ULscj06xbX9HhixBLncLB6JqCSd97fnaAr8JgO_TRZvulqE9xGMQH6AcMvDqxe1iIViKGPYkyGi0pcHDYFKs-mzLm_R1dhK1NxVzXcv2kI2qWF8kwaJux0VkDCACx-gLolrvdTJoZ25XKcGSBVY0FNlmhRPT_7P3IFVlk-3D991W2c3QXTtLX-kumVeDZn7SgYyC109WTxYTGTx0vqSMGGNqouwKNdDgT_ZxlBeclBIpEKCRV8PMvQEOidztFUP_npE"/>
</div>
<span class="text-title-md font-title-md font-bold text-primary dark:text-primary-fixed-dim">Smart Print</span>
</div>
<div class="bg-surface-container-high px-3 py-1.5 rounded-full">
<span class="text-label-md font-label-md text-primary">UID: 25013003</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-24 px-margin-mobile md:px-margin-desktop max-w-lg mx-auto w-full">
<!-- Header Section -->
<section class="mb-8">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Print Settings</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Configure your document for printing</p>
</section>
<!-- Selection Cards: Print Type -->
<section class="mb-8">
<h2 class="text-label-md font-label-md text-outline mb-4 uppercase tracking-widest">Print Type</h2>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center gap-2 p-6 rounded-xl border-2 border-primary bg-primary-container text-on-primary-container transition-all active:scale-95" id="opt-type-bw" onclick="selectOption('type', 'bw')">
<span class="material-symbols-outlined text-4xl">invert_colors_off</span>
<span class="text-label-md font-label-md">B&amp;W</span>
</button>
<button class="flex flex-col items-center gap-2 p-6 rounded-xl border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-variant transition-all active:scale-95" id="opt-type-color" onclick="selectOption('type', 'color')">
<span class="material-symbols-outlined text-4xl">palette</span>
<span class="text-label-md font-label-md">Color</span>
</button>
</div>
</section>
<!-- Selection Cards: Page Style -->
<section class="mb-8">
<h2 class="text-label-md font-label-md text-outline mb-4 uppercase tracking-widest">Page Style</h2>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center gap-2 p-6 rounded-xl border-2 border-primary bg-primary-container text-on-primary-container transition-all active:scale-95" id="opt-style-single" onclick="selectOption('style', 'single')">
<span class="material-symbols-outlined text-4xl">note</span>
<span class="text-label-md font-label-md">Single Side</span>
</button>
<button class="flex flex-col items-center gap-2 p-6 rounded-xl border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-variant transition-all active:scale-95" id="opt-style-double" onclick="selectOption('style', 'double')">
<span class="material-symbols-outlined text-4xl">import_contacts</span>
<span class="text-label-md font-label-md">Double Side</span>
</button>
</div>
</section>
<!-- Stepper: Number of Copies -->
<section class="mb-8 p-6 rounded-xl bg-surface-container-low flex justify-between items-center">
<div>
<h2 class="text-title-md font-title-md text-on-surface">Copies</h2>
<p class="text-label-sm font-label-sm text-on-surface-variant">Number of sets needed</p>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 rounded-full border border-outline flex items-center justify-center hover:bg-surface-variant active:scale-90 transition-all" onclick="updateCopies(-1)">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="text-title-md font-title-md w-8 text-center" id="copy-count">1</span>
<button class="w-10 h-10 rounded-full border border-outline flex items-center justify-center hover:bg-surface-variant active:scale-90 transition-all" onclick="updateCopies(1)">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</section>
<!-- Custom Range Input: Page Range -->
<section class="mb-10">
<div class="flex justify-between items-center mb-4">
<h2 class="text-label-md font-label-md text-outline uppercase tracking-widest">Page Range</h2>
<span class="text-label-md font-label-md text-primary bg-primary-fixed px-3 py-1 rounded-full">All Pages</span>
</div>
<div class="px-2">
<input class="w-full h-1.5" id="page-range" max="50" min="1" oninput="updateRangeText(this.value)" type="range" value="50"/>
<div class="flex justify-between mt-2 text-label-sm font-label-sm text-outline">
<span>Page 1</span>
<span id="range-end">Page 50</span>
</div>
</div>
</section>
<!-- Live Cost Calculator Card -->
<section class="mb-12">
<div class="glass-card p-6 rounded-2xl shadow-lg shadow-primary/5 flex flex-col gap-4 border-l-4 border-primary">
<div class="flex justify-between items-center">
<span class="text-body-md font-body-md text-on-surface-variant">Total Pages</span>
<span class="text-label-md font-label-md font-bold" id="calc-pages">50</span>
</div>
<div class="flex justify-between items-center">
<span class="text-body-md font-body-md text-on-surface-variant">Cost Per Page</span>
<span class="text-label-md font-label-md font-bold" id="calc-rate">$0.10</span>
</div>
<div class="h-px bg-outline-variant w-full my-1"></div>
<div class="flex justify-between items-center">
<span class="text-title-md font-title-md text-on-surface">Total Cost</span>
<span class="text-headline-lg-mobile font-headline-lg-mobile text-primary" id="total-cost">$5.00</span>
</div>
</div>
</section>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-headline-lg-mobile text-headline-lg-mobile shadow-lg shadow-primary/20 active:scale-[0.98] transition-all hover:bg-primary-container hover:text-on-primary-container flex items-center justify-center gap-3">
            Review Document
            <span class="material-symbols-outlined">chevron_right</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface dark:bg-inverse-surface shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-6 py-1 hover:bg-surface-variant transition-all" href="#">
<span class="material-symbols-outlined">cloud_upload</span>
<span class="text-label-sm font-label-sm">Upload</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-6 py-1 scale-105 duration-300" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="text-label-sm font-label-sm">My Prints</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-6 py-1 hover:bg-surface-variant transition-all" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-label-sm font-label-sm">Profile</span>
</a>
</nav>
<script>
        let state = {
            type: 'bw',
            style: 'single',
            copies: 1,
            pages: 50
        };

        const rates = {
            bw: 0.10,
            color: 0.50
        };

        function selectOption(group, value) {
            state[group] = value;
            
            // UI Updates
            const buttons = group === 'type' ? ['bw', 'color'] : ['single', 'double'];
            buttons.forEach(opt => {
                const btn = document.getElementById(`opt-${group}-${opt}`);
                if (opt === value) {
                    btn.classList.remove('border-outline-variant', 'bg-surface-container-lowest', 'text-on-surface-variant');
                    btn.classList.add('border-primary', 'bg-primary-container', 'text-on-primary-container');
                } else {
                    btn.classList.add('border-outline-variant', 'bg-surface-container-lowest', 'text-on-surface-variant');
                    btn.classList.remove('border-primary', 'bg-primary-container', 'text-on-primary-container');
                }
            });

            calculate();
        }

        function updateCopies(delta) {
            state.copies = Math.max(1, state.copies + delta);
            document.getElementById('copy-count').innerText = state.copies;
            calculate();
        }

        function updateRangeText(val) {
            state.pages = parseInt(val);
            document.getElementById('range-end').innerText = `Page ${val}`;
            document.getElementById('calc-pages').innerText = val;
            calculate();
        }

        function calculate() {
            const rate = rates[state.type];
            const total = (state.pages * rate * state.copies).toFixed(2);
            
            document.getElementById('calc-rate').innerText = `$${rate.toFixed(2)}`;
            document.getElementById('total-cost').innerText = `$${total}`;
        }
    </script>
</body></html>
