<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-lg flex flex-col items-center justify-center px-margin-mobile pt-24 pb-12 text-center">
<!-- Success Animation Container -->
<div class="relative w-48 h-48 mb-unit animate-float">
<!-- Animated Background Rings -->
<div class="absolute inset-0 bg-tertiary-fixed-dim opacity-20 rounded-full scale-110 animate-pulse"></div>
<div class="absolute inset-4 bg-tertiary-fixed-dim opacity-30 rounded-full scale-105"></div>

<div class="relative w-full h-full bg-tertiary-container rounded-full flex items-center justify-center success-glow">

<path class="check-draw" d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>

<!-- Headline -->

<!-- Instruction Text -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mb-10 leading-relaxed">

<!-- UID Display Card -->

<button class="material-symbols-outlined text-primary-container p-2 rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-90" title="Copy UID">
                    content_copy

</div>
</div>
<!-- Action Section -->

<button class="w-full h-14 bg-primary text-on-primary font-title-md text-title-md rounded-xl flex items-center justify-center gap-2 shadow-lg hover:bg-primary-container transition-all active:scale-[0.98] duration-150" onclick="window.location.reload()">
<span class="material-symbols-outlined">home</span>

</div>

<!-- Bottom Navigation implementation (Suppressed per "Task-Focused" rule but technically available if required) -->
<!-- Not rendered as this is a "Success/Confirmation" splash screen which prioritizes content canvas -->
<script>
        // Micro-interaction for the copy button
        document.querySelector('button[title="Copy UID"]').addEventListener('click', function() {
            const uidText = "25013003";
            navigator.clipboard.writeText(uidText).then(() => {
                const icon = this;
                const originalText = icon.innerText;
                icon.innerText = 'check';
                icon.classList.add('text-tertiary');
                setTimeout(() => {
                    icon.innerText = originalText;
                    icon.classList.remove('text-tertiary');
                }, 2000);
            });
        });

        // Add visual feedback to button click
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
    </script>
