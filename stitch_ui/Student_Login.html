<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Shell Filtering: Navigation (BottomNavBar, SideNav) suppressed for transactional login page -->
<main class="w-full max-w-md flex flex-col items-center space-y-12">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center space-y-6">
<div class="w-32 h-32 md:w-40 md:h-40 bg-surface-container rounded-3xl p-4 shadow-sm flex items-center justify-center">
<img alt="Smart Print Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyiu6s2JTPGnswZA1eR1JGMfYFFRlEI0zkrWreT3W4Q0WcScegQcPecqZeJNnTuWtuMb4N8IlmLMeU2wvhcDoTiG3r3-wJpdTVvKLSCUs4s6IrKEf3XFTWAH_g4JgH6Tk6YSTRWifxyHVo9-gF2OE_ObQID0cWOzKiaLYl8A1o4-d8G00AW8h0wDUbwpF5ucQXkMpEakHjVyMapGYMx_UCaT-e-ClojZddPe0VcYcnYUvHawp0A5aB7bUHPikPAHkd2DkPd_kbsTI"/>
</div>
<div class="text-center space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight">
                    Smart Print Login
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter your College UID to continue
                </p>
</div>
</div>
<!-- Login Form Section -->
<section class="w-full bg-surface-container-lowest rounded-3xl p-8 shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30">
<form class="space-y-8" id="loginForm" onsubmit="return handleLogin(event)">
<div class="space-y-4">
<label class="block font-label-md text-label-md text-primary font-bold" for="uid">
                        COLLEGE UID
                    </label>
<div class="relative group">
<input class="uid-input w-full h-16 px-6 bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl font-headline-lg-mobile text-headline-lg-mobile text-on-surface transition-all duration-200 placeholder:text-outline/30 placeholder:tracking-normal" id="uid" inputmode="numeric" name="uid" pattern="[0-9]*" placeholder="20248832" required="" type="text"/>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary">
<span class="material-symbols-outlined">badge</span>
</div>
</div>
<p class="font-label-sm text-label-sm text-outline px-2">
                        Your UID is printed on your student identification card.
                    </p>
</div>
<button class="w-full h-14 md:h-16 bg-primary text-on-primary font-title-md text-title-md rounded-xl shadow-md hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all duration-200 flex items-center justify-center gap-3 group" id="submitBtn" type="submit">
                    Continue
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
</section>
<!-- Footer Branding (Minimal) -->
<footer class="text-center">
<p class="font-label-sm text-label-sm text-outline-variant">
                © 2024 Smart Print Campus Utilities
            </p>
</footer>
</main>
<!-- Subtle Background Atmosphere -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden opacity-50">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[5%] right-[0%] w-[30%] h-[30%] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<script>
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;
            
            // Micro-interaction: Loading state
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                // In a real app, this would redirect. Here we simulate success.
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Verified';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-tertiary', 'text-on-tertiary');
                
                setTimeout(() => {
                    // Reset or transition to dashboard
                    console.log('Login successful for UID:', document.getElementById('uid').value);
                }, 1000);
            }, 1200);
            
            return false;
        }

        // Auto-formatting for UID spacing if needed
        const uidInput = document.getElementById('uid');
        uidInput.addEventListener('input', (e) => {
            // Ensure only numbers
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body></html>
